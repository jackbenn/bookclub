{% extends "base.html" %}
{% set user = admin %}
{% set c = club.accent_color %}
{% block title %}Edit book{% endblock %}
{% block content %}
<div class="flex items-center gap-4 mb-6">
  <a href="/{{ club.slug }}/admin/books" class="text-stone-400 hover:text-stone-600 text-sm">← Books</a>
  <h1 class="text-2xl font-bold">Edit book</h1>
</div>

<form method="post" action="/{{ club.slug }}/admin/books/{{ book.id }}/edit" class="space-y-4 max-w-lg">

  <div>
    <label class="block text-sm font-medium mb-1">Title</label>
    <input name="title" type="text" required value="{{ book.title }}"
      class="w-full border border-stone-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-{{ c }}-400">
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Author</label>
    <input name="author" type="text" required value="{{ book.author }}"
      class="w-full border border-stone-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-{{ c }}-400">
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Pages</label>
    <input name="page_count" type="number" min="1" value="{{ book.page_count or '' }}"
      class="w-full border border-stone-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-{{ c }}-400">
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Goodreads URL</label>
    <input name="goodreads_url" type="url" value="{{ book.goodreads_url or '' }}"
      class="w-full border border-stone-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-{{ c }}-400">
  </div>

  {% if book.status.value in ("selected", "historical") %}
  <div class="flex gap-3">
    <div>
      <label class="block text-sm font-medium mb-1">Year read</label>
      <input name="selected_year" type="number" min="1900" max="2100"
        value="{{ book.selected_year or '' }}"
        class="w-28 border border-stone-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-{{ c }}-400">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Month read</label>
      <input name="selected_month" type="number" min="1" max="12"
        value="{{ book.selected_month or '' }}"
        class="w-20 border border-stone-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-{{ c }}-400">
    </div>
  </div>
  {% else %}
  <input type="hidden" name="selected_year" value="">
  <input type="hidden" name="selected_month" value="">
  {% endif %}

  <div class="flex gap-3">
    <button type="submit"
      class="bg-{{ c }}-500 hover:bg-{{ c }}-600 text-white font-semibold rounded px-4 py-2 text-sm">
      Save changes
    </button>
    <a href="/{{ club.slug }}/admin/books"
      class="text-sm text-stone-500 hover:text-stone-700 self-center">Cancel</a>
  </div>
</form>
{% endblock %}
